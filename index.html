<script>
(function () {
  'use strict';

  // ════════════════════════════ Configuración ════════════════════════════
  var CFG = window.WISHLIST_CONFIG || {};
  // Las URLs copiadas con varias cuentas abiertas traen "/u/1/": la quitamos para que funcione para todos.
  var SCRIPT_URL = String(CFG.SCRIPT_URL || '').trim().replace(/\/macros\/u\/\d+\/s\//, '/macros/s/');
  var URL_VALIDA = /^https?:\/\/\S+\/macros\/s\/[^/\s]+\/(exec|dev)(\?\S*)?$/.test(SCRIPT_URL);
  var MODO_LOCAL = !URL_VALIDA;
  var URL_MAL_PUESTA = SCRIPT_URL !== '' && !URL_VALIDA;
  var MUESTRA = CFG.MUESTRA === true;   // vista previa con deseos de ejemplo (no toca la hoja)
  var INSTRUCCIONES = 'https://github.com/zuicagerman-eng/Html-wishlist-#readme';
  var MONEDA = String(CFG.MONEDA == null ? '$' : CFG.MONEDA).trim();
  // Cada quien con su mundo: la 1.ª persona es de Hogwarts (varita) y la 2.ª de Hyrule (Espada Maestra)
  var SIMBOLOS = ['varita', 'espada'];
  var EMBLEMAS = { varita: 'img/hogwarts.png', espada: 'img/zelda.png' };
  var MUNDOS = { varita: 'Hogwarts', espada: 'Hyrule' };
  var DETALLE = { varita: 'Hogwarts · varita', espada: 'Hyrule · Espada Maestra' };
  var FRASES = {
    varita: ['¡Lumos! ✨', '¡Wingardium Leviosa! 🪶', '¡Expecto Patronum! 🦌', '¡Accio regalos! 🎁', '¡Alohomora! 🔓', 'Travesura realizada ✨'],
    espada: ['¡Es peligroso ir solo! Toma esto ⚔️', '¡Hey! ¡Listen! 🧚', '¡Conseguiste una rupia roja! 💎', '¡Yahaha! ¡Me encontraste! 🍃', 'Da-da-da-daaa 🎶 ¡Un corazón más! ❤️']
  };
  var POS_KOLOG = [[7, 34], [89, 30], [21, 40], [92, 6]];   // izquierda %, abajo % dentro del castillo (lejos del botón de agregar)
  var DIACRITICOS = new RegExp('[' + String.fromCharCode(0x300) + '-' + String.fromCharCode(0x36f) + ']', 'g');
  var VS16 = String.fromCharCode(0xFE0F), ZWJ = String.fromCharCode(0x200D);

  var PERSONAS = [];
  (Array.isArray(CFG.PERSONAS) ? CFG.PERSONAS : []).forEach(function (n) {
    n = String(n == null ? '' : n).trim().slice(0, 40);
    if (n && !PERSONAS.some(function (p) { return clave(p) === clave(n); })) PERSONAS.push(n);
  });
  if (!PERSONAS.length) PERSONAS = ['Andrea', 'David'];
  PERSONAS = PERSONAS.slice(0, 6);

  var CATEGORIAS = [
    ['🎁', 'Sorpresa'], ['👗', 'Ropa'], ['👟', 'Zapatos'], ['💄', 'Belleza'], ['💍', 'Accesorios'],
    ['📱', 'Tecnología'], ['🎮', 'Juegos'], ['📚', 'Libros'], ['🏠', 'Casa'], ['🍳', 'Cocina'],
    ['✈️', 'Experiencias'], ['🎵', 'Música'], ['⚽', 'Deporte'], ['🍫', 'Antojos']
  ].map(function (c) { return { emoji: c[0], nombre: c[1], valor: c[0] + ' ' + c[1] }; });

  var PRIORIDADES = { 1: 'Me gustaría', 2: 'Me encantaría', 3: '¡Lo quiero muchísimo!' };

  var COLORES_BOLA = [
    ['#ef4f63', '#a3001f'], ['#3cc47c', '#0f6339'], ['#ffd45c', '#b07a12'],
    ['#5cb6ff', '#1b5fb8'], ['#c07cf5', '#6b2fa6']
  ];

  var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

  var CONSEJOS = [
    'En tu propia lista nunca verás qué te van a regalar: es un hechizo sorpresa 🤫',
    'Si apartas un regalo de Hyrule se abre un cofre; si es de Hogwarts… ¡Accio! 🪄',
    'Si ves volar la snitch dorada, ¡atrápala! ✨',
    'Por ahí hay una hoja traviesa que se mueve sola… búscala 🍃',
    'Toca los escudos de Hogwarts y Hyrule de arriba 🛡️',
    'Allá abajo, junto al castillo, la Espada Maestra espera en su pedestal ⚔️',
    'Con «cambiar» puedes entrar como la otra persona.',
    'Cada domingo de Adviento se enciende una vela de la corona 🕯️',
    'Los corazones dicen cuánto lo quieres; la rupia, cuánto cuesta 💎',
    'Abajo, «Nox» pausa la magia para ahorrar batería y «Lumos» la vuelve a prender.',
    'En el iPhone: Compartir → «Agregar a pantalla de inicio» y queda como app 📱'
  ];

  // Velas flotantes: x %, y px, tamaño, opacidad, duración s, retraso s
  var VELAS = [
    [4, 30, 0.95, 0.95, 6.4, -1.1], [15, 116, 0.7, 0.7, 7.3, -3.2], [27, 12, 1.15, 1, 5.9, -2.1],
    [39, 66, 0.55, 0.5, 8.2, -4.4], [60, 54, 0.6, 0.55, 7.8, -0.6], [72, 14, 0.85, 0.85, 6.8, -3.8],
    [84, 100, 1.05, 0.95, 6.1, -1.7], [93, 36, 0.75, 0.75, 7.5, -5.1]
  ];

  // ════════════════════════════ Utilidades ════════════════════════════
  function $(sel) { return document.querySelector(sel); }
  function clave(s) {
    return String(s == null ? '' : s).trim().toLowerCase().normalize('NFD').replace(DIACRITICOS, '');
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function uid() {
    if (window.crypto && crypto.randomUUID) return 'w' + crypto.randomUUID().replace(/-/g, '').slice(0, 15);
    return 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
  }
  function hash(s) {
    var h = 0;
    s = String(s);
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    return Math.abs(h);
  }
  function recortar(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function plural(n, uno, varios) { return n + ' ' + (n === 1 ? uno : varios); }
  function inicial(s) { var t = String(s || '').trim(); return t ? t.charAt(0).toUpperCase() : ''; }
  function simbolo(nombre) {
    var i = PERSONAS.map(clave).indexOf(clave(nombre));
    return i > -1 ? (SIMBOLOS[i] || null) : null;
  }
  function icono(s, glifo) {
    if (s !== 'varita' && s !== 'espada') return '';
    return '<svg class="ico ico-' + s + '" aria-hidden="true" focusable="false"><use href="#' + (glifo ? 'g-' : 'i-') + s + '"/></svg>';
  }

  var memoria = {
    leer: function (k, def) {
      try { var v = localStorage.getItem('wishlist-navidad.' + k); return v == null ? def : JSON.parse(v); }
      catch (e) { return def; }
    },
    escribir: function (k, v) {
      try { localStorage.setItem('wishlist-navidad.' + k, JSON.stringify(v)); return true; }
      catch (e) { return false; }
    }
  };

  function aPrioridad(v) {
    var s = String(v == null ? '' : v);
    var n = (s.match(/⭐/g) || []).length || parseInt(s, 10) || 2;
    return Math.max(1, Math.min(3, n));
  }

  /** Entiende "1.500", "1,500", "12,50", "$ 25", "1.234,56"… Devuelve número o null. */
  function aPrecio(v) {
    if (v === null || v === undefined || v === '') return null;
    if (typeof v === 'number') return isFinite(v) && v >= 0 ? Math.round(v * 100) / 100 : null;
    var s = String(v).replace(/[^\d.,]/g, '');
    if (!/\d/.test(s)) return null;
    var punto = s.lastIndexOf('.'), coma = s.lastIndexOf(','), dec = -1;
    if (punto > -1 && coma > -1) dec = Math.max(punto, coma);
    else {
      var i = Math.max(punto, coma);
      if (i > -1 && (s.match(/[.,]/g) || []).length === 1 && s.length - i - 1 <= 2) dec = i;
    }
    var entero = (dec > -1 ? s.slice(0, dec) : s).replace(/[.,]/g, '');
    var decimales = dec > -1 ? s.slice(dec + 1).replace(/[.,]/g, '') : '';
    var n = Number((entero || '0') + (decimales ? '.' + decimales : ''));
    return isFinite(n) ? Math.round(n * 100) / 100 : null;
  }

  function formateador(decimales) {
    try { return new Intl.NumberFormat(undefined, { minimumFractionDigits: decimales, maximumFractionDigits: decimales }); }
    catch (e) { return { format: function (n) { return n.toFixed(decimales); } }; }
  }
  var formatoEntero = formateador(0);
  var formatoCentavos = formateador(2);
  function dinero(n) {
    var s = (Math.round(n * 100) % 100 === 0 ? formatoEntero : formatoCentavos).format(n);
    return MONEDA === '€' ? s + ' €' : MONEDA + s;
  }

  function linkSeguro(s) {
    s = String(s || '').trim();
    if (!s) return null;
    if (!/^[a-z][a-z0-9+.-]*:/i.test(s) && /^[\w-]+(\.[\w-]+)+([/?#]|$)/.test(s)) s = 'https://' + s;
    try {
      var u = new URL(s);
      if (u.protocol !== 'http:' && u.protocol !== 'https:') return null;
      return { href: u.href, dominio: u.hostname.replace(/^www\./, '') };
    } catch (e) { return null; }
  }

  function emojiDe(cat) {
    var s = String(cat || '').trim();
    if (!s) return '🎁';
    var sinEmoji = s.replace(/^[^\wÀ-ÿ]+/, '');
    for (var i = 0; i < CATEGORIAS.length; i++) {
      var c = CATEGORIAS[i];
      if (c.valor === s || clave(c.nombre) === clave(sinEmoji)) return c.emoji;
    }
    try {
      var m = s.match(new RegExp('^\\p{Extended_Pictographic}(' + VS16 + '|' + ZWJ + '\\p{Extended_Pictographic})*', 'u'));
      if (m) return m[0];
    } catch (e) { /* navegador viejo */ }
    return '🎁';
  }

  function normalizar(it) {
    it = it || {};
    var estado = String(it.estado || '').toLowerCase();
    return {
      id: String(it.id || '').trim(),
      persona: String(it.persona || '').trim(),
      titulo: String(it.titulo || '').trim(),
      categoria: String(it.categoria || '').trim(),
      prioridad: aPrioridad(it.prioridad),
      precio: aPrecio(it.precio),
      link: String(it.link || '').trim(),
      notas: String(it.notas || '').trim(),
      reservadoPor: String(it.reservadoPor || '').trim(),
      estado: estado.indexOf('compr') > -1 ? 'comprado' : estado.indexOf('reserv') > -1 ? 'reservado' : '',
      creado: String(it.creado || ''),
      actualizado: String(it.actualizado || '')
    };
  }

  // ════════════════════════════ Estado ════════════════════════════
  var items = (memoria.leer('items', []) || []).map(normalizar).filter(function (it) { return it.id; });
  var pendientes = memoria.leer('pendientes', []) || [];          // cambios aún no guardados en la hoja
  var yo = memoria.leer('yo', null);
  var pestana = memoria.leer('pestana', null);
  var ultimaSync = memoria.leer('ultimaSync', null);
  var magia = memoria.leer('magia', true) !== false;

  if (yo && (!yo.nombre || (!yo.invitado && !PERSONAS.some(function (p) { return clave(p) === clave(yo.nombre); })))) yo = null;

  var enVuelo = {};               // opId → true mientras se envía
  var sincronizando = false;
  var refrescando = false;
  var errorActual = null;
  var intentos = 0;
  var timerReintento = null;
  var timerPronto = null;
  var epocaEscritura = 0;
  var recienAgregado = null;
  var recienSellado = null;
  var editando = null;
  var htmlLista = '';
  var velasDibujadas = -1;
  var eligiendo = false;
  var reducido = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function magiaActiva() { return magia && !reducido; }

  function guardarPendientes() { memoria.escribir('pendientes', pendientes); }

  if (MUESTRA && !items.length && !pendientes.length && !memoria.leer('muestra-sembrada', false)) {
    pendientes = datosDeMuestra().map(function (d) { return { opId: uid(), op: 'add', id: d.id, data: d }; });
    guardarPendientes();
    memoria.escribir('muestra-sembrada', true);
  }

  function datosDeMuestra() {
    var a = PERSONAS[0], b = PERSONAS[1] || PERSONAS[0], base = Date.now();
    var filas = [
      [a, 'Bolsa de piel color café', '💍 Accesorios', 3, 1200, 'https://www.liverpool.com.mx', 'La que vimos en el centro 👀', b, 'reservado'],
      [a, 'Perfume floral', '💄 Belleza', 2, 1850.5, '', 'Tamaño de 50 ml', b, 'comprado'],
      [a, 'Viaje a la playa', '✈️ Experiencias', 3, null, '', '', '', ''],
      [a, 'Pijama navideña', '👗 Ropa', 2, 450, '', 'Talla M, la de renos 🦌', '', ''],
      [a, 'Taza para chocolate caliente', '🏠 Casa', 1, 150, '', '', '', ''],
      [b, 'Tenis para correr', '👟 Zapatos', 3, 2300, '', 'Talla 27, color negro', a, 'reservado'],
      [b, 'Libro: El nombre del viento', '📚 Libros', 2, 399, '', '', '', ''],
      [b, 'Audífonos inalámbricos', '📱 Tecnología', 2, 1500, 'https://www.amazon.com.mx', 'Con cancelación de ruido', '', '']
    ];
    return filas.map(function (f, i) {
      return {
        id: 'muestra' + (i + 1), persona: f[0], titulo: f[1], categoria: f[2], prioridad: f[3], precio: f[4],
        link: f[5], notas: f[6], reservadoPor: f[7], estado: f[8],
        creado: new Date(base - (filas.length - i) * 60000).toISOString(), actualizado: ''
      };
    });
  }

  /** Lo que se ve = lo último de la hoja + los cambios que aún no se suben. */
  function vista() {
    var mapa = new Map();
    items.forEach(function (it) { mapa.set(it.id, it); });
    var sinSubir = new Set();
    pendientes.forEach(function (op) {
      if (op.op === 'add') {
        mapa.set(op.id, normalizar(Object.assign({}, mapa.get(op.id) || {}, op.data, { id: op.id })));
        sinSubir.add(op.id);
      } else if (op.op === 'update') {
        var actual = mapa.get(op.id);
        if (actual) {
          mapa.set(op.id, normalizar(Object.assign({}, actual, op.changes)));
          sinSubir.add(op.id);
        }
      } else if (op.op === 'delete') {
        mapa.delete(op.id);
        sinSubir.delete(op.id);
      }
    });
    return { lista: Array.from(mapa.values()), sinSubir: sinSubir };
  }

  function buscar(id) {
    return vista().lista.filter(function (it) { return it.id === id; })[0] || null;
  }

  /** Agrega un cambio a la cola (y lo junta con el anterior cuando se puede). */
  function encolar(op) {
    op.opId = uid();
    var libre = function (o) { return !enVuelo[o.opId]; };

    if (op.op === 'update' && !op.si) {
      for (var i = pendientes.length - 1; i >= 0; i--) {
        var o = pendientes[i];
        if (o.id !== op.id) continue;
        if (libre(o) && !o.si && o.op === 'add') { Object.assign(o.data, op.changes); guardarPendientes(); return; }
        if (libre(o) && !o.si && o.op === 'update') { Object.assign(o.changes, op.changes); guardarPendientes(); return; }
        break;
      }
    }
    if (op.op === 'delete') {
      pendientes = pendientes.filter(function (o) { return o.id !== op.id || !libre(o); });
    }
    if (op.op === 'add') {   // "Deshacer" un borrado que aún no se envió
      pendientes = pendientes.filter(function (o) { return !(o.id === op.id && o.op === 'delete' && libre(o)); });
    }
    pendientes.push(op);
    guardarPendientes();
  }

  // ════════════════════════════ Sincronización con Google Sheets ════════════════════════════
  function error(tipo, mensaje) { var e = new Error(mensaje); e.tipo = tipo; return e; }

  function llamar(cuerpo) {
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 30000);
    var url = SCRIPT_URL;
    var opciones = { method: 'GET', redirect: 'follow' };
    if (ctrl) opciones.signal = ctrl.signal;
    if (cuerpo) {
      opciones.method = 'POST';
      // text/plain = petición "simple": Google la acepta sin permisos extra (CORS).
      opciones.headers = { 'Content-Type': 'text/plain;charset=utf-8' };
      opciones.body = JSON.stringify(cuerpo);
    } else {
      url += (url.indexOf('?') > -1 ? '&' : '?') + '_=' + Date.now();
    }
    return fetch(url, opciones)
      .then(function (r) { return r.text(); })
      .then(function (texto) {
        var json;
        try { json = JSON.parse(texto); }
        catch (e) { throw error('raro', 'La URL no devolvió datos de la hoja'); }
        if (!json || json.ok !== true) throw error('servidor', (json && json.error) || 'Error en Google Sheets');
        if (!Array.isArray(json.items)) throw error('raro', 'Respuesta inesperada de Google Sheets');
        return json;
      })
      .catch(function (e) {
        if (e && e.tipo) throw e;
        if (e && e.name === 'AbortError') throw error('lento', 'Google tardó demasiado');
        throw error(navigator.onLine === false ? 'offline' : 'red', navigator.onLine === false ? 'Sin internet' : 'No pude conectar con Google Sheets');
      })
      .then(function (json) { clearTimeout(timer); return json; }, function (e) { clearTimeout(timer); throw e; });
  }

  function recibir(lista) {
    var nuevos = (lista || []).map(normalizar).filter(function (it) { return it.id; });
    items = nuevos;
    memoria.escribir('items', items);
  }

  function exito() {
    errorActual = null;
    intentos = 0;
    clearTimeout(timerReintento);
    ultimaSync = new Date().toISOString();
    memoria.escribir('ultimaSync', ultimaSync);
  }

  function fallo(e) {
    errorActual = e;
    intentos++;
    clearTimeout(timerReintento);
    var espera = [4, 10, 20, 45, 90][Math.min(intentos - 1, 4)] * 1000;
    timerReintento = setTimeout(sincronizar, espera);
  }

  function sincronizar() {
    if (MODO_LOCAL || sincronizando) return Promise.resolve();
    var lote = pendientes.filter(function (o) { return !enVuelo[o.opId]; }).slice(0, 50);
    if (!lote.length) return refrescar();
    if (navigator.onLine === false) { pintarEstado(); return Promise.resolve(); }

    sincronizando = true;
    lote.forEach(function (o) { enVuelo[o.opId] = true; });
    pintarEstado();
    var cuerpo = {
      ops: lote.map(function (o) { return { op: o.op, id: o.id, data: o.data, changes: o.changes, si: o.si }; })
    };
    var bien = false;
    return llamar(cuerpo).then(function (resp) {
      var enviados = {};
      lote.forEach(function (o) { enviados[o.opId] = true; });
      pendientes = pendientes.filter(function (o) { return !enviados[o.opId]; });
      guardarPendientes();
      epocaEscritura++;
      recibir(resp.items);
      exito();
      bien = true;
      if ((resp.resultados || []).indexOf('conflicto') > -1) {
        avisar('😅 Alguien más lo apartó justo antes que tú');
      }
    }).catch(fallo).then(function () {
      lote.forEach(function (o) { delete enVuelo[o.opId]; });
      sincronizando = false;
      pintar();
      if (bien && pendientes.length) return sincronizar();
    });
  }

  function refrescar() {
    if (MODO_LOCAL || refrescando || sincronizando) return Promise.resolve();
    if (pendientes.length) return sincronizar();
    if (navigator.onLine === false) { pintarEstado(); return Promise.resolve(); }
    refrescando = true;
    pintarEstado();
    var epoca = epocaEscritura;
    return llamar(null).then(function (resp) {
      // Si mientras tanto se guardó algo, esta respuesta ya está vieja: se ignora.
      if (epoca === epocaEscritura && !sincronizando) recibir(resp.items);
      exito();
    }).catch(fallo).then(function () {
      refrescando = false;
      pintar();
    });
  }

  function sincronizarPronto() {
    if (MODO_LOCAL) return;
    clearTimeout(timerPronto);
    timerPronto = setTimeout(sincronizar, 500);
  }

  // ════════════════════════════ Dibujos ════════════════════════════
  function corazones(n) {
    var s = '';
    for (var i = 1; i <= 3; i++) {
      s += '<svg class="corazon' + (i > n ? ' apagado' : '') + '" viewBox="0 0 24 22" aria-hidden="true">' +
        '<path class="relleno" d="M12 20.5S2.6 14.9 1.4 8.9C.6 5 3 1.6 6.7 1.6c2.2 0 3.9 1.1 5.3 3 1.4-1.9 3.1-3 5.3-3 3.7 0 6.1 3.4 5.3 7.3C21.4 14.9 12 20.5 12 20.5z"/>' +
        '<path class="brillo" d="M5.6 5.4c-1.3.5-2 1.6-1.9 3"/></svg>';
    }
    return s;
  }

  function gema(precio) {
    var c = precio < 500 ? ['#7af0a4', '#22a052', '#0f5a2b'] :
      precio < 1500 ? ['#9fd2ff', '#2a74d4', '#123f80'] :
      precio < 3000 ? ['#ff9aa6', '#d1263f', '#7a0d1d'] : ['#e2c0ff', '#8a4ad6', '#4a1f80'];
    return '<svg class="gema" viewBox="0 0 14 22" aria-hidden="true">' +
      '<path d="M7 .5 13.5 5v12L7 21.5.5 17V5z" fill="' + c[1] + '" stroke="' + c[2] + '"/>' +
      '<path d="M7 4 10.5 6.5v9L7 18l-3.5-2.5v-9z" fill="' + c[0] + '" opacity=".85"/>' +
      '<path d="M4.6 6.6 7 5" stroke="#fff" stroke-width="1.1" stroke-linecap="round" opacity=".9"/></svg>';
  }

  function corona(encendidas) {
    var cx = 110, cy = 66, rx = 84, ry = 19, partes = [];
    for (var i = 0; i < 30; i++) {
      var a = i / 30 * Math.PI * 2;
      var x = cx + rx * Math.cos(a), y = cy + ry * Math.sin(a);
      var giro = Math.atan2(ry * Math.cos(a), -rx * Math.sin(a)) * 180 / Math.PI + (i % 2 ? 28 : -28);
      var verde = i % 3 === 0 ? '#1d5a33' : i % 3 === 1 ? '#2b7a45' : '#3a9356';
      partes.push({ y: y, svg: '<ellipse cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" rx="12" ry="5.2" fill="' + verde +
        '" transform="rotate(' + giro.toFixed(0) + ' ' + x.toFixed(1) + ' ' + y.toFixed(1) + ')"/>' });
      if (i % 4 === 2) {
        partes.push({ y: y + 0.2, svg: '<circle cx="' + (x + 3).toFixed(1) + '" cy="' + (y - 2).toFixed(1) + '" r="3.2" fill="#d61f3c"/>' +
          '<circle cx="' + (x + 2).toFixed(1) + '" cy="' + (y - 3).toFixed(1) + '" r="1" fill="#ff9aa8"/>' });
      }
    }
    // Orden de encendido: 1 adelante-izq, 2 atrás-izq, 3 atrás-der (rosa), 4 adelante-der
    [[135, '#7b4bb3', '#4d2a7a'], [215, '#7b4bb3', '#4d2a7a'], [325, '#ec8fb5', '#b3537e'], [45, '#7b4bb3', '#4d2a7a']].forEach(function (v, k) {
      var a = v[0] * Math.PI / 180;
      var x = cx + rx * Math.cos(a), y = cy + ry * Math.sin(a);
      var h = y > cy ? 36 : 31, w = 12, arriba = y - h;
      var g = '<rect x="' + (x - w / 2).toFixed(1) + '" y="' + arriba.toFixed(1) + '" width="' + w + '" height="' + h + '" rx="2" fill="' + v[1] + '"/>' +
        '<rect x="' + (x - w / 2 + 2).toFixed(1) + '" y="' + (arriba + 2).toFixed(1) + '" width="3" height="' + (h - 6) + '" rx="1.5" fill="#fff" opacity=".28"/>' +
        '<rect x="' + (x + w / 2 - 3).toFixed(1) + '" y="' + arriba.toFixed(1) + '" width="3" height="' + h + '" fill="' + v[2] + '" opacity=".45"/>' +
        '<path d="M' + x.toFixed(1) + ' ' + arriba.toFixed(1) + 'v-4" stroke="#2a1a0a" stroke-width="1.4" stroke-linecap="round"/>';
      if (k < encendidas) {
        g += '<circle cx="' + x.toFixed(1) + '" cy="' + (arriba - 8).toFixed(1) + '" r="15" fill="url(#c-brillo)"/>' +
          '<ellipse class="llama-c l' + (k + 1) + '" cx="' + x.toFixed(1) + '" cy="' + (arriba - 8).toFixed(1) + '" rx="3.8" ry="6.8" fill="url(#c-llama)"/>';
      }
      partes.push({ y: y + 0.5, svg: g });
    });
    partes.sort(function (p, q) { return p.y - q.y; });
    return '<svg viewBox="0 0 220 104" aria-hidden="true"><defs>' +
      '<radialGradient id="c-llama" cx="50%" cy="70%" r="60%"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#ffe48a"/><stop offset=".75" stop-color="#ffa23a"/><stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/></radialGradient>' +
      '<radialGradient id="c-brillo"><stop offset="0" stop-color="#ffcf70" stop-opacity=".55"/><stop offset="1" stop-color="#ffcf70" stop-opacity="0"/></radialGradient>' +
      '</defs>' + partes.map(function (p) { return p.svg; }).join('') + '</svg>';
  }

  /** Velas de Adviento: una por cada domingo de Adviento que ya pasó. */
  function adviento(hoy) {
    var anio = hoy.getFullYear();
    var nochebuena = new Date(anio, 11, 24);
    var cuarto = 24 - nochebuena.getDay();
    var domingos = [21, 14, 7, 0].map(function (d) { return new Date(anio, 11, cuarto - d); });
    var dia = new Date(anio, hoy.getMonth(), hoy.getDate());
    var n = domingos.filter(function (d) { return d <= dia; }).length;
    var fecha = function (d) { return 'domingo ' + d.getDate() + ' de ' + MESES[d.getMonth()]; };
    var texto = n === 0 ? 'La primera vela de Adviento se enciende el ' + fecha(domingos[0]) :
      n < 4 ? ['Primera', 'Segunda', 'Tercera'][n - 1] + ' semana de Adviento · la próxima vela, el ' + fecha(domingos[n]) :
      'Las cuatro velas de Adviento ya están encendidas';
    return { encendidas: n, texto: texto };
  }

  // Lechuza blanca de las nieves con la carta en las patas
  var BUHO =
    '<svg viewBox="0 0 120 104" aria-hidden="true">' +
      '<g class="ala-b izq"><path d="M42 50 Q10 28 2 56 Q22 50 42 64Z" fill="#f4f6f8" stroke="#c9d2dc"/><path d="M12 50l4 2M20 46l4 2M28 44l4 2M18 54l4 1" stroke="#2a2a2a" stroke-width="1.6" stroke-linecap="round"/></g>' +
      '<g class="ala-b der"><path d="M78 50 Q110 28 118 56 Q98 50 78 64Z" fill="#f4f6f8" stroke="#c9d2dc"/><path d="M108 50l-4 2M100 46l-4 2M92 44l-4 2M102 54l-4 1" stroke="#2a2a2a" stroke-width="1.6" stroke-linecap="round"/></g>' +
      '<ellipse cx="60" cy="56" rx="24" ry="28" fill="#fbfcfd" stroke="#d5dde6"/>' +
      '<path d="M50 62l3 2M58 66l3 2M66 62l3 2M54 72l3 2M63 73l3 2" stroke="#3a3a3a" stroke-width="1.5" stroke-linecap="round"/>' +
      '<circle cx="51" cy="44" r="8.5" fill="#ffd23f" stroke="#e0a800"/><circle cx="69" cy="44" r="8.5" fill="#ffd23f" stroke="#e0a800"/>' +
      '<circle cx="51.5" cy="44.5" r="4.4" fill="#1b1b1b"/><circle cx="68.5" cy="44.5" r="4.4" fill="#1b1b1b"/>' +
      '<circle cx="53" cy="43" r="1.5" fill="#fff"/><circle cx="70" cy="43" r="1.5" fill="#fff"/>' +
      '<path d="M57 50 L63 50 L60 55.5Z" fill="#3a3a3a"/>' +
      '<path d="M52 82l-2 5M56 83v5M64 83v5M68 82l2 5" stroke="#9a9a9a" stroke-width="2.2" stroke-linecap="round"/>' +
      '<g transform="translate(45 86)"><rect width="30" height="18" rx="2" fill="#fbf1da" stroke="#c9a565"/><path d="M0 1 15 11 30 1" fill="none" stroke="#c9a565"/><circle cx="15" cy="11" r="3.8" fill="#b3162b"/></g>' +
    '</svg>';

  var ARBOL =
    '<svg viewBox="0 0 120 150" aria-hidden="true">' +
      '<defs><linearGradient id="g-arbol" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fd18a"/><stop offset="1" stop-color="#12643a"/></linearGradient></defs>' +
      '<rect x="52" y="122" width="16" height="20" rx="3" fill="#7a4a24"/>' +
      '<g fill="url(#g-arbol)" stroke="url(#g-arbol)" stroke-width="8" stroke-linejoin="round">' +
        '<path d="M60 66 L106 122 H14 Z"/><path d="M60 40 L96 92 H24 Z"/><path d="M60 18 L86 60 H34 Z"/>' +
      '</g>' +
      '<path d="M34 60 Q60 74 86 56 M26 94 Q60 112 96 88" fill="none" stroke="#ffd54a" stroke-width="2.5" stroke-dasharray="1 5" stroke-linecap="round"/>' +
      '<g><circle cx="48" cy="50" r="4.5" fill="#ff4d5e"/><circle cx="73" cy="46" r="4" fill="#5cc2ff"/><circle cx="60" cy="74" r="5" fill="#ffd54a"/>' +
      '<circle cx="38" cy="84" r="4.5" fill="#5cc2ff"/><circle cx="82" cy="82" r="4.5" fill="#ff4d5e"/><circle cx="28" cy="114" r="5" fill="#ffd54a"/>' +
      '<circle cx="56" cy="106" r="4.5" fill="#ff4d5e"/><circle cx="90" cy="112" r="5" fill="#fff"/><circle cx="74" cy="100" r="4" fill="#c07cf5"/></g>' +
      '<path class="estrella-brilla" d="M60 3 L62.7 10.3 L70.5 10.6 L64.4 15.4 L66.5 22.9 L60 18.6 L53.5 22.9 L55.6 15.4 L49.5 10.6 L57.3 10.3 Z" fill="#ffd54a" stroke="#fff3b0" stroke-width="1.2" stroke-linejoin="round"/>' +
    '</svg>';

  // ════════════════════════════ Pintar ════════════════════════════
  function esYo(nombre) { return !!yo && !yo.invitado && clave(nombre) === clave(yo.nombre); }
  function avatar(nombre) {
    var s = simbolo(nombre);
    if (s) return icono(s);
    return PERSONAS.map(clave).indexOf(clave(nombre)) > -1 ? '⭐' : '🎁';
  }

  function personasVisibles(lista) {
    var conocidas = PERSONAS.map(clave);
    var orden = PERSONAS.slice();
    lista.forEach(function (it) {
      if (it.persona && conocidas.indexOf(clave(it.persona)) === -1) {
        conocidas.push(clave(it.persona));
        orden.push(it.persona);
      }
    });
    if (yo && !yo.invitado) {
      var i = orden.map(clave).indexOf(clave(yo.nombre));
      if (i > 0) orden.unshift(orden.splice(i, 1)[0]);
    }
    return orden;
  }

  function pintar() {
    if (!yo) return;
    var v = vista();
    var personas = personasVisibles(v.lista);
    if (!pestana || personas.map(clave).indexOf(clave(pestana)) === -1) pestana = personas[0];
    var miTema = yo.invitado ? '' : (simbolo(yo.nombre) || '');
    if (document.body.getAttribute('data-tema') !== miTema) {
      document.body.setAttribute('data-tema', miTema);
      $('#fab').innerHTML = (icono(miTema) || '<span aria-hidden="true">🪄</span>') + ' Agregar deseo';
      ponerCursores(miTema);
    }
    pintarCabecera();
    pintarPestanas(v.lista, personas);
    pintarLista(v);
    pintarEstado();
  }

  function pintarCabecera() {
    var hoy = new Date();
    $('#sub').textContent = 'Hogwarts ✦ Hyrule · Navidad ' + hoy.getFullYear();
    if (!$('#duo').children.length) pintarDuo();
    $('#pie-nombres').textContent = PERSONAS.join(' & ');
    $('#cuenta').innerHTML = cuentaRegresiva(hoy);
    var adv = adviento(hoy);
    if (adv.encendidas !== velasDibujadas) {
      $('#corona').innerHTML = corona(adv.encendidas);
      velasDibujadas = adv.encendidas;
    }
    $('#vela-nota').textContent = adv.texto;
    $('#hola').innerHTML = 'Hola, <b>' + esc(yo.nombre) + '</b> ' + (yo.invitado ? '👋' : avatar(yo.nombre)) +
      ' <button type="button" class="mini-btn" data-accion="cambiar-persona">cambiar</button>';
    $('#btn-magia').textContent = magia ? '✨ Lumos: magia encendida' : '🌙 Nox: magia en pausa';
    var atrapadas = Number(memoria.leer('esferas', 0)) || 0;
    var semillas = Number(memoria.leer('kologs', 0)) || 0;
    var logros = [];
    if (atrapadas) logros.push('✨ Snitch atrapadas: ' + atrapadas);
    if (semillas) logros.push('🍃 Semillas kolog: ' + semillas);
    $('#pie-esferas').hidden = !logros.length;
    $('#pie-esferas').textContent = logros.join(' · ');

    var aviso = $('#aviso-config');
    if (MUESTRA) {
      aviso.className = 'aviso';
      aviso.innerHTML = '<b>👀 Muestra con deseos de ejemplo</b><p>Prueba todo: agrega, edita, aparta regalos y toca "cambiar" para ver la lista desde el otro lado (el modo sorpresa). Nada de esto llega a la hoja de Google.</p>';
      aviso.hidden = false;
    } else if (URL_MAL_PUESTA) {
      aviso.className = 'aviso error';
      aviso.innerHTML = '<b>⚠️ La URL de config.js no se ve bien</b><p>Debe ser la "URL de la aplicación web" de Apps Script y terminar en <code>/exec</code>. Mientras tanto, todo se guarda solo en este teléfono.</p><a href="' + INSTRUCCIONES + '" target="_blank" rel="noopener">Ver instrucciones →</a>';
      aviso.hidden = false;
    } else if (MODO_LOCAL) {
      aviso.className = 'aviso';
      aviso.innerHTML = '<b>🧪 Modo prueba: falta conectar Google Sheets</b><p>Lo que escriban se guarda en este teléfono y se subirá solito a la hoja en cuanto la conecten.</p><a href="' + INSTRUCCIONES + '" target="_blank" rel="noopener">Ver cómo conectarla →</a>';
      aviso.hidden = false;
    } else {
      aviso.hidden = true;
    }
  }

  function pintarDuo() {
    $('#duo').innerHTML = PERSONAS.slice(0, 2).map(function (p, i) {
      var s = SIMBOLOS[i];
      return '<button type="button" class="duo-lado" data-accion="emblema" data-tema="' + s + '">' +
        '<img src="' + EMBLEMAS[s] + '" alt="' + (s === 'varita' ? 'Escudo de Hogwarts' : 'Z de Zelda con la Espada Maestra') + '">' +
        '<span class="duo-nombre">' + icono(s) + esc(p) + '</span><small>' + MUNDOS[s] + '</small></button>';
    }).join('<span class="duo-y" aria-hidden="true">✦</span>');
  }

  function cuentaRegresiva(hoy) {
    var d = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
    var navidad = new Date(hoy.getFullYear(), 11, 25);
    var dias = Math.round((navidad - d) / 86400000);
    if (dias > 2) return 'Faltan <b>' + dias + '</b> días para Navidad';
    if (dias === 2) return '¡Mañana es Nochebuena! 🌟';
    if (dias === 1) return '¡Hoy es Nochebuena! 🌟';
    if (dias === 0) return '¡Feliz Navidad! 🎁';
    return '¡Felices fiestas! ✨';
  }

  function pintarPestanas(lista, personas) {
    $('#pestanas').innerHTML = personas.map(function (p) {
      var n = lista.filter(function (it) { return clave(it.persona) === clave(p); }).length;
      var sel = clave(p) === clave(pestana);
      return '<button type="button" role="tab" aria-selected="' + sel + '" data-accion="pestana" data-persona="' + esc(p) + '" data-tema="' + (simbolo(p) || '') + '">' +
        '<span class="ava" aria-hidden="true">' + avatar(p) + '</span>' +
        '<span>' + (esYo(p) ? 'Mi lista' : esc(p)) + '</span>' +
        '<span class="num">' + n + '</span></button>';
    }).join('');
  }

  function porPrioridad(a, b) {
    return b.prioridad - a.prioridad || (a.creado < b.creado ? -1 : a.creado > b.creado ? 1 : 0);
  }
  function pesoEstado(it) { return it.estado === 'comprado' ? 2 : it.estado === 'reservado' ? 1 : 0; }

  function pintarLista(v) {
    var mia = esYo(pestana);
    var deseos = v.lista.filter(function (it) { return clave(it.persona) === clave(pestana); });
    deseos.sort(mia ? porPrioridad : function (a, b) { return pesoEstado(a) - pesoEstado(b) || porPrioridad(a, b); });

    var nombre = esc(pestana);
    var simTab = simbolo(pestana);
    var emb = EMBLEMAS[simTab] ? '<img class="emblema-lista" src="' + EMBLEMAS[simTab] + '" alt="">' : '';
    var cabeza;
    var resumen = [plural(deseos.length, 'deseo', 'deseos')];
    if (mia) {
      cabeza = '<h2>' + emb + 'Tu carta para Santa</h2><p class="pista">🤫 Hechizo sorpresa: aquí nunca verás si alguien ya te apartó o compró algo.</p>';
    } else {
      cabeza = '<h2>' + emb + 'Lo que quiere ' + nombre + '</h2><p class="pista">Aparta lo que le vas a regalar. ' + nombre + ' no lo verá 🤫</p>';
      var libres = deseos.filter(function (it) { return !it.estado; }).length;
      var mios = deseos.filter(function (it) { return it.estado && clave(it.reservadoPor) === clave(yo.nombre); }).length;
      if (deseos.length) resumen.push(plural(libres, 'disponible', 'disponibles'));
      if (mios) resumen.push('🎁 ' + mios + ' de tu parte');
    }
    var total = deseos.reduce(function (s, it) { return s + (it.precio || 0); }, 0);
    if (total > 0) resumen.push('≈ ' + dinero(total));

    var cuerpo;
    if (deseos.length) {
      cuerpo = deseos.map(function (it) { return tarjeta(it, mia, v.sinSubir.has(it.id)); }).join('');
    } else if (mia) {
      cuerpo = '<div class="vacio">' + ARBOL + '<h3>Tu carta para Santa está vacía</h3>' +
        '<p>Escribe lo que te gustaría recibir esta Navidad: con link, precio y todo.</p>' +
        '<button type="button" class="btn pri" data-accion="agregar">🪄 Escribir mi primer deseo</button></div>';
    } else {
      cuerpo = '<div class="vacio">' + ARBOL + '<h3>' + nombre + ' todavía no pide nada</h3>' +
        '<p>Cuando agregue sus deseos, aparecerán aquí. ¡Dile que se apure! 🦉</p></div>';
    }

    var html = '<div class="lista-cabeza">' + cabeza + '<div class="resumen"><span>' + resumen.join('</span><span>') + '</span></div></div>' + cuerpo;
    if (html !== htmlLista) {
      $('#lista').innerHTML = html;
      htmlLista = html;
    }
    $('#fab').hidden = !mia;
  }

  function tarjeta(it, mia, sinSubir) {
    var link = linkSeguro(it.link);
    var tomado = !mia && !!it.estado;
    var porMi = tomado && clave(it.reservadoPor) === clave(yo.nombre);
    var colores = COLORES_BOLA[hash(it.id) % COLORES_BOLA.length];
    var id = esc(it.id);
    var sello = '';
    var acciones = '';

    if (mia) {
      acciones = '<button type="button" class="btn sec chico" data-accion="editar" data-id="' + id + '">✏️ Editar</button>' +
        '<button type="button" class="btn sec chico" data-accion="borrar" data-id="' + id + '">🗑️ Borrar</button>';
    } else if (!it.estado) {
      acciones = '<button type="button" class="btn verde" data-accion="reservar" data-id="' + id + '">🎁 Yo se lo regalo</button>';
    } else if (porMi && it.estado === 'reservado') {
      sello = '<div class="sello mio">🎁 Lo vas a regalar tú</div>';
      acciones = '<button type="button" class="btn verde chico" data-accion="comprado" data-id="' + id + '">✅ Ya lo compré</button>' +
        '<button type="button" class="btn sec chico" data-accion="soltar" data-id="' + id + '">Ya no</button>';
    } else if (porMi) {
      sello = '<div class="sello mio">✅ ¡Ya lo compraste!</div>';
      acciones = '<button type="button" class="btn sec chico" data-accion="no-comprado" data-id="' + id + '">↩️ Deshacer</button>';
    } else {
      var quien = it.reservadoPor ? esc(it.reservadoPor) : 'Alguien';
      sello = it.estado === 'comprado'
        ? '<div class="sello">✅ ' + quien + ' ya lo compró</div>'
        : '<div class="sello">🎁 Lo va a regalar ' + (it.reservadoPor ? quien : 'alguien') + '</div>';
    }

    var meta = '';
    if (it.precio != null) meta += '<span class="etiqueta precio">' + gema(it.precio) + esc(dinero(it.precio)) + '</span>';
    if (link) meta += '<a class="etiqueta link" href="' + esc(link.href) + '" target="_blank" rel="noopener noreferrer">🔗 ' + esc(link.dominio) + '</a>';
    else if (it.link) meta += '<span class="etiqueta">📍 ' + esc(recortar(it.link, 40)) + '</span>';
    if (sinSubir && !MODO_LOCAL) meta += '<span class="etiqueta pendiente" title="Se guardará en Google Sheets en cuanto haya conexión">⏳ Guardando…</span>';

    var lacre = '';
    if (tomado) {
      var simR = simbolo(it.reservadoPor);
      if (it.estado === 'comprado') lacre = '<span class="mono oro" aria-hidden="true">✓</span>';
      else if (simR) lacre = '<span class="mono ' + simR + '" aria-hidden="true">' + icono(simR, true) + '</span>';
      else lacre = '<span class="mono invitado" aria-hidden="true">' + esc(inicial(it.reservadoPor) || '♥') + '</span>';
    }

    return '<article class="deseo' + (tomado ? ' tomado' : '') + (porMi ? ' por-mi' : '') +
        (it.id === recienAgregado ? ' nuevo' : '') + (it.id === recienSellado ? ' sellando' : '') + '" data-id="' + id + '">' +
      '<div class="bola" style="--b1:' + colores[0] + ';--b2:' + colores[1] + '" aria-hidden="true"><span>' + esc(emojiDe(it.categoria)) + '</span></div>' +
      '<div class="cuerpo">' +
        '<h3>' + esc(it.titulo || 'Sin nombre') + '</h3>' +
        '<div class="prio p' + it.prioridad + '"><span class="corazones" aria-hidden="true">' + corazones(it.prioridad) + '</span><span>' + PRIORIDADES[it.prioridad] + '</span></div>' +
        (meta ? '<div class="meta">' + meta + '</div>' : '') +
        (it.notas ? '<p class="notas">' + esc(it.notas) + '</p>' : '') +
        sello +
        (acciones ? '<div class="acciones">' + acciones + '</div>' : '') +
      '</div>' + lacre +
    '</article>';
  }

  function pintarEstado() {
    var tipo, ico, texto;
    var n = pendientes.length;
    if (MUESTRA) { tipo = 'local'; ico = '👀'; texto = 'Muestra · nada se guarda en la hoja'; }
    else if (URL_MAL_PUESTA) { tipo = 'error'; ico = '⚠️'; texto = 'Revisa la URL en config.js'; }
    else if (MODO_LOCAL) { tipo = 'local'; ico = '🧪'; texto = 'Modo prueba · solo en este teléfono'; }
    else if (sincronizando) { tipo = 'trabajando'; ico = '⏳'; texto = 'Guardando en Google Sheets…'; }
    else if (navigator.onLine === false) {
      tipo = 'offline'; ico = '📴';
      texto = n ? 'Sin internet · ' + plural(n, 'cambio espera', 'cambios esperan') + ' para subir' : 'Sin internet · viendo lo último guardado';
    }
    else if (errorActual) { tipo = 'error'; ico = '⚠️'; texto = errorActual.message + ' · reintentando'; }
    else if (n) { tipo = 'trabajando'; ico = '⏳'; texto = 'Guardando…'; }
    else if (refrescando && !ultimaSync) { tipo = 'trabajando'; ico = '🦉'; texto = 'La lechuza trae los deseos…'; }
    else { tipo = 'ok'; ico = '✅'; texto = 'Todo guardado en Google Sheets'; }
    var el = $('#estado');
    el.dataset.tipo = tipo;
    el.innerHTML = '<span class="ico" aria-hidden="true">' + ico + '</span> ' + esc(texto);
    el.title = MODO_LOCAL ? '' : 'Toca para actualizar';

    var pie = $('#pie-sync');
    pie.textContent = MUESTRA ? 'Vista de muestra con deseos de ejemplo.' :
      MODO_LOCAL ? 'Los datos están en este teléfono (modo prueba).' :
      ultimaSync ? 'Última sincronización con Google Sheets: ' + haceCuanto(ultimaSync) + '.' : '';
  }

  function haceCuanto(iso) {
    var s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 45) return 'hace un momento';
    if (s < 90) return 'hace 1 minuto';
    if (s < 3600) return 'hace ' + Math.round(s / 60) + ' minutos';
    if (s < 5400) return 'hace 1 hora';
    if (s < 86400) return 'hace ' + Math.round(s / 3600) + ' horas';
    return new Date(iso).toLocaleDateString();
  }

  // ════════════════════════════ Avisos, chispas y festejos ════════════════════════════

    if (accion) {
      t.querySelector('button').onclick = function () {
        t.classList.remove('visible');

      };

    t.classList.add('visible');

  function celebrar(emojis) {
    if (!magiaActiva()) return;
    emojis = emojis || ['✨', '⭐', '❄️', '🕯️', '🎁', '❤️'];
    var cont = document.createElement('div');
    cont.className = 'festejo';
    cont.setAttribute('aria-hidden', 'true');
    for (var i = 0; i < 18; i++) {
      var s = document.createElement('span');
      var ang = Math.random() * Math.PI * 2;
      var dist = 70 + Math.random() * 130;
      s.textContent = emojis[i % emojis.length];
      s.style.setProperty('--x', (Math.cos(ang) * dist).toFixed(0) + 'px');
      s.style.setProperty('--y', (Math.sin(ang) * dist - 50).toFixed(0) + 'px');
      s.style.setProperty('--r', (Math.random() * 360 - 180).toFixed(0) + 'deg');
      s.style.animationDelay = (Math.random() * 0.12).toFixed(2) + 's';
      cont.appendChild(s);
    }
    document.body.appendChild(cont);
    setTimeout(function () { cont.remove(); }, 1400);
  }

  var chispasVivas = 0;
  function chispas(x, y, n) {
    if (!magiaActiva()) return;
    for (var i = 0; i < n && chispasVivas < 50; i++) {
      var s = document.createElement('span');
      var ang = Math.random() * Math.PI * 2;
      var dist = 12 + Math.random() * (n > 4 ? 48 : 18);
      s.className = 'chispa';
      s.textContent = Math.random() < 0.5 ? '✦' : '✧';
      s.style.fontSize = (8 + Math.random() * 9).toFixed(0) + 'px';
      s.style.setProperty('--x0', x.toFixed(0) + 'px');
      s.style.setProperty('--y0', y.toFixed(0) + 'px');
      s.style.setProperty('--x1', (x + Math.cos(ang) * dist).toFixed(0) + 'px');
      s.style.setProperty('--y1', (y + Math.sin(ang) * dist).toFixed(0) + 'px');
      document.body.appendChild(s);
      chispasVivas++;
      setTimeout(function (el) { el.remove(); chispasVivas--; }.bind(null, s), 750);
    }
  }

  function volarBuho() {

  // ── Esfera dorada con alas: aparece de vez en cuando, ¡atrápala! ──
  var timerEsfera = null, volando = false, rafEsfera = 0;
  function programarEsfera(pronto) {
    clearTimeout(timerEsfera);
    if (!magiaActiva()) return;
    timerEsfera = setTimeout(lanzarEsfera, pronto ? 9000 + Math.random() * 6000 : 45000 + Math.random() * 45000);
  }
  function lanzarEsfera() {
    var el = $('#esfera');
    if (volando) return;
    if (!magiaActiva() || !yo || document.hidden || $('#app').hidden || !$('#modal').hidden || !$('#cofre').hidden) {
      programarEsfera(false);
      return;
    }
    volando = true;
    el.classList.remove('atrapada');
    el.hidden = false;
    var w = window.innerWidth, h = window.innerHeight;
    var deIzq = Math.random() < 0.5;
    var y0 = h * (0.22 + Math.random() * 0.45), amp = 30 + Math.random() * 50;
    var dur = 6500 + Math.random() * 2500, t0 = 0;
    function paso(t) {
      if (!volando) return;
      if (!t0) t0 = t;
      var p = (t - t0) / dur;
      if (p >= 1) { terminarEsfera(); return; }
      var x = deIzq ? -50 + (w + 100) * p : w + 50 - (w + 100) * p;
      var y = y0 + Math.sin(p * Math.PI * 3.2) * amp + Math.sin(p * 23) * 7;
      el.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)' + (deIzq ? '' : ' scaleX(-1)');
      rafEsfera = requestAnimationFrame(paso);
    }
    rafEsfera = requestAnimationFrame(paso);
  }
  function terminarEsfera() {
    volando = false;
    cancelAnimationFrame(rafEsfera);
    $('#esfera').hidden = true;
    programarEsfera(false);
  }
  function atraparEsfera(e) {
    if (!volando) return;
    e.preventDefault();
    volando = false;
    cancelAnimationFrame(rafEsfera);
    var el = $('#esfera');
    var r = el.getBoundingClientRect();
    el.classList.add('atrapada');
    chispas(r.left + r.width / 2, r.top + r.height / 2, 18);
    var n = (Number(memoria.leer('esferas', 0)) || 0) + 1;
    memoria.escribir('esferas', n);
    avisar('✨ ¡Atrapaste la snitch dorada! Llevas ' + n);
    setTimeout(function () { el.hidden = true; el.classList.remove('atrapada'); }, 450);

    programarEsfera(false);

  function normalizarLink(s) {
    s = String(s || '').trim();
    if (s && !/^[a-z][a-z0-9+.-]*:/i.test(s) && /^[\w-]+(\.[\w-]+)+([/?#]|$)/.test(s)) s = 'https://' + s;
    return s.slice(0, 2000);

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var inputTitulo = campos.namedItem('titulo');

    if (!titulo) {
      inputTitulo.classList.add('mal');

    var original = editando ? buscar(editando) : null;

    if (cambios.estado) sellar(id);
    pintar();
    sincronizarPronto();
    avisar(mensaje);
    if (cambios.estado === 'comprado') celebrar(['✅', '🎁', '✨', '⭐']);
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-accion]');
    if (!b) return;
    var fn = ACCIONES[b.getAttribute('data-accion')];
    if (fn) { e.preventDefault(); fn(b); }
  });

  $('#form-invitado').addEventListener('submit', function (e) {
    e.preventDefault();
    var nombre = this.elements.namedItem('nombre').value.trim().slice(0, 40);
    if (nombre) elegir(nombre, true);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!$('#cofre').hidden) cerrarCofre();
    else if (!$('#modal').hidden) cerrarFormulario();
  });

  // Chispas al tocar y estela de la varita (en compu)
  document.addEventListener('pointerdown', function (e) {
    if (e.isPrimary !== false) chispas(e.clientX, e.clientY, 6);
  }, { passive: true });
  if (window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches) {
    var ultimaEstela = 0;
    document.addEventListener('pointermove', function (e) {
      var ahora = Date.now();
      if (ahora - ultimaEstela < 45) return;
      ultimaEstela = ahora;
      chispas(e.clientX, e.clientY, 1);
    }, { passive: true });
  }

  // ════════════════════════════ Cielo: estrellas, nieve y polvo dorado ════════════════════════════
  var cielo = (function () {
    var cv = $('#cielo');
    var ctx = cv.getContext && cv.getContext('2d');
    var w = 0, h = 0, estrellas = [], copos = [], polvo = [], raf = 0, ultimo = 0, t = 0, animado = false;
    var brillo = null;
    if (ctx) {
      brillo = document.createElement('canvas');
      brillo.width = brillo.height = 32;
      var b = brillo.getContext('2d');
      var g = b.createRadialGradient(16, 16, 0, 16, 16, 16);
      g.addColorStop(0, 'rgba(255, 244, 200, 1)');
      g.addColorStop(0.25, 'rgba(255, 214, 120, .75)');
      g.addColorStop(1, 'rgba(255, 200, 90, 0)');
      b.fillStyle = g;
      b.fillRect(0, 0, 32, 32);
    }

    function copo(alInicio) {
      return { x: Math.random() * w, y: alInicio ? Math.random() * h : -8, r: 0.8 + Math.random() * 2.3, v: 0.3 + Math.random() * 0.8, f: Math.random() * 6.28, a: 0.3 + Math.random() * 0.55 };
    }
    function mota(alInicio) {
      return { x: Math.random() * w, y: alInicio ? Math.random() * h : h + 10, s: 6 + Math.random() * 10, v: 0.15 + Math.random() * 0.35, f: Math.random() * 6.28 };
    }
    function medir() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      cv.width = Math.round(w * dpr);
      cv.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      estrellas = [];
      var n = Math.round(Math.min(140, (w * h) / 5200));
      for (var i = 0; i < n; i++) {
        estrellas.push({ x: Math.random() * w, y: Math.pow(Math.random(), 1.6) * h * 0.85, r: Math.random() < 0.12 ? 2 : 1, a: 0.35 + Math.random() * 0.6, v: 0.6 + Math.random() * 1.8, f: Math.random() * 6.28, grande: Math.random() < 0.07 });
      }
      var nc = Math.round(Math.min(90, Math.max(35, (w * h) / 11000)));
      while (copos.length < nc) copos.push(copo(true));
      copos.length = nc;
      while (polvo.length < 14) polvo.push(mota(true));
    }
    function dibujar(dt) {
      ctx.clearRect(0, 0, w, h);
      var i, e, c, m, a;
      for (i = 0; i < estrellas.length; i++) {
        e = estrellas[i];
        a = e.a * (0.55 + 0.45 * Math.sin(t * e.v + e.f));
        if (e.grande) {
          ctx.globalAlpha = a;
          ctx.drawImage(brillo, e.x - 8, e.y - 8, 16, 16);
        }
        ctx.globalAlpha = a;
        ctx.fillStyle = '#fff8e0';
        ctx.fillRect(e.x, e.y, e.r, e.r);
      }
      ctx.fillStyle = '#ffffff';
      for (i = 0; i < copos.length; i++) {
        c = copos[i];
        if (dt) {
          c.y += c.v * dt * (0.6 + c.r * 0.25);
          c.f += 0.012 * dt;
          c.x += Math.sin(c.f) * 0.35 * dt;
          if (c.y > h + 6 || c.x < -10 || c.x > w + 10) { copos[i] = c = copo(false); }
        }
        ctx.globalAlpha = c.a;
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r, 0, 6.2832);
        ctx.fill();
      }
      for (i = 0; i < polvo.length; i++) {
        m = polvo[i];
        if (dt) {
          m.y -= m.v * dt;
          m.f += 0.02 * dt;
          m.x += Math.sin(m.f) * 0.3 * dt;
          if (m.y < -12) { polvo[i] = m = mota(false); }
        }
        ctx.globalAlpha = 0.35 + 0.35 * Math.sin(t * 2 + m.f);
        ctx.drawImage(brillo, m.x - m.s / 2, m.y - m.s / 2, m.s, m.s);
      }
      ctx.globalAlpha = 1;
    }
    function cuadro(ms) {
      var dt = ultimo ? Math.min((ms - ultimo) / 16.7, 3) : 1;
      ultimo = ms;
      t += 0.016 * dt;
      dibujar(dt);
      raf = requestAnimationFrame(cuadro);
    }
    function arrancar() {
      cancelAnimationFrame(raf);
      ultimo = 0;
      if (!ctx || document.hidden) return;
      if (animado) raf = requestAnimationFrame(cuadro); else dibujar(0);
    }
    if (ctx) {
      medir();
      window.addEventListener('resize', function () { medir(); arrancar(); });
      document.addEventListener('visibilitychange', arrancar);
    }
    return { activar: function (si) { animado = !!si; arrancar(); } };
  })();

  // ════════════════════════════ Velas y cursores ════════════════════════════
  function colgarVelas() {
    $('#velas').innerHTML = VELAS.map(function (v) {
      return '<div class="vela" style="--x:' + v[0] + '%;--y:' + v[1] + 'px;--s:' + v[2] + ';--o:' + v[3] + ';--t:' + v[4] + 's;--d:' + v[5] + 's">' +
        '<span class="llama"></span><span class="cera"></span></div>';
    }).join('');
  }

  /** El cursor (en compu) es la varita para Andrea y la Espada Maestra para David. */
  function ponerCursores(tema) {
    if (tema === 'espada') {
      var espada = "<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'>" +
        "<path d='M3 3 L19 19' stroke='#2b3540' stroke-width='5' stroke-linecap='round'/>" +
        "<path d='M3 3 L19 19' stroke='#eef3f8' stroke-width='3' stroke-linecap='round'/>" +
        "<path d='M15 23 L23 15' stroke='#2b2266' stroke-width='5' stroke-linecap='round'/>" +
        "<path d='M15 23 L23 15' stroke='#6b5fd3' stroke-width='3' stroke-linecap='round'/>" +
        "<path d='M20 20 L28 28' stroke='#2b2266' stroke-width='4.6' stroke-linecap='round'/>" +
        "<path d='M20 20 L28 28' stroke='#4b3d9e' stroke-width='2.6' stroke-linecap='round'/>" +
        "<circle cx='19' cy='19' r='1.9' fill='#ffd84a'/></svg>";
      var url = 'url("data:image/svg+xml,' + encodeURIComponent(espada) + '") 3 3';
      document.documentElement.style.setProperty('--cursor-varita', url + ', auto');
      document.documentElement.style.setProperty('--cursor-varita-luz', url + ', pointer');
      return;
    }
    var varita ="<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'>" +
      "<path d='M6 6 L27 27' stroke='#1a0f08' stroke-width='5' stroke-linecap='round'/>" +
      "<path d='M6 6 L27 27' stroke='#5a3a1e' stroke-width='3' stroke-linecap='round'/>" +
      "<path d='M19 19 L27 27' stroke='#8a5a2e' stroke-width='3.4' stroke-linecap='round'/>" +
      "<path d='M4 .5 L5.2 3 L8 4 L5.2 5 L4 7.5 L2.8 5 L0 4 L2.8 3 Z' fill='#ffe27a' stroke='#b8860b' stroke-width='.6'/></svg>";
    var varitaLuz = "<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'>" +
      "<circle cx='4' cy='4' r='4' fill='#fff3b0' opacity='.6'/>" +
      "<path d='M6 6 L27 27' stroke='#1a0f08' stroke-width='5' stroke-linecap='round'/>" +
      "<path d='M6 6 L27 27' stroke='#5a3a1e' stroke-width='3' stroke-linecap='round'/>" +
      "<path d='M19 19 L27 27' stroke='#8a5a2e' stroke-width='3.4' stroke-linecap='round'/>" +
      "<path d='M4 -1 L5.6 2.4 L9 4 L5.6 5.6 L4 9 L2.4 5.6 L-1 4 L2.4 2.4 Z' fill='#fff' stroke='#e0a80f' stroke-width='.7'/></svg>";
    var raiz = document.documentElement.style;
    raiz.setProperty('--cursor-varita', 'url("data:image/svg+xml,' + encodeURIComponent(varita) + '") 4 4, auto');
    raiz.setProperty('--cursor-varita-luz', 'url("data:image/svg+xml,' + encodeURIComponent(varitaLuz) + '") 4 4, pointer');
  }

  function aplicarMagia() {
    document.body.classList.toggle('sin-magia', !magiaActiva());
    cielo.activar(magiaActiva());
    if (magiaActiva()) {
      if (yo) programarEsfera(true);
    } else {
      clearTimeout(timerEsfera);
      if (volando) terminarEsfera();
      $('#burbuja').hidden = true;
    }
  }

  // ════════════════════════════ Arranque ════════════════════════════
  colgarVelas();
  ponerCursores(yo && !yo.invitado ? simbolo(yo.nombre) : 'varita');
  moverKolog();
  aplicarMagia();

  if (yo) {
    $('#app').hidden = false;
    pintar();
    saludoHada();
  } else {
    mostrarQuien();
  }

  if (!MODO_LOCAL) {
    sincronizar();
    window.addEventListener('online', function () { errorActual = null; intentos = 0; sincronizar(); });
    window.addEventListener('offline', pintarEstado);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) sincronizar(); });
    window.addEventListener('pageshow', function (e) { if (e.persisted) sincronizar(); });
    setInterval(function () {
      if (!document.hidden) sincronizar();
      if (yo) pintarEstado();
    }, 30000);
  }

  if (!MUESTRA && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* sin modo offline, no pasa nada */ });
    });
  }

  // Para pruebas automáticas
  window.__wishlist = {
    estado: function () { return { items: items, pendientes: pendientes, yo: yo, errorActual: errorActual && errorActual.message, sincronizando: sincronizando }; },
    sincronizar: sincronizar,
    lanzarEsfera: lanzarEsfera
  };
})();
</script>
</body>
